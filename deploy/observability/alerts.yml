# Prometheus alerting rules for the metrics D-088 added, plus the pre-existing operational ones.
# Each rule keys off a real, verified metric (see DEVIATIONS D-088) -- not aspirational thresholds.
groups:
  - name: acde
    rules:
      - alert: ACDELoopStalled
        # Matches acde loop-health's own threshold exactly (MONITORING_INTERVAL_S * 3, default
        # 15s * 3 = 45s -- see cli.py::cmd_loop_health), so the container healthcheck and this
        # alert agree. If you change MONITORING_INTERVAL_S, update this threshold too.
        expr: time() - acde_loop_last_tick_timestamp_seconds > 45
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ACDE control loop has not ticked in over a minute"
          description: "The process governing pipelines may be hung or crashed. Check `docker compose ps acde-loop` and its logs."

      - alert: ACDEStaleExecutingActions
        # D-084's write-ahead audit trail: a row stuck at status='executing' means a crash happened
        # between the intent write and the outcome update -- the exact scenario that fix targets.
        expr: acde_stale_executing_actions > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} action(s) stuck at status=executing"
          description: "Query telemetry.agent_actions WHERE status='executing' to find them; the side effect may or may not have actually happened."

      - alert: ACDEApprovalsBacklog
        expr: acde_approvals_pending > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} approvals pending for 15+ minutes"
          description: "Proposals are queued for human sign-off and not being worked. `acde approvals list`."

      - alert: ACDEDenialSpike
        expr: increase(acde_actions_denied_total[10m]) > 5
        labels:
          severity: warning
        annotations:
          summary: "Policy denied {{ $value }} actions in the last 10 minutes"
          description: "Agents are repeatedly proposing actions the policy rejects -- check policy config or a misbehaving/hallucinating LLM (see DEVIATIONS D-082)."

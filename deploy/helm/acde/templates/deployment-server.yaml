apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acde.fullname" . }}-server
  labels:
    {{- include "acde.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  {{- if not .Values.server.autoscaling.enabled }}
  replicas: {{ .Values.server.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "acde.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "acde.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: acde-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
            capabilities:
              {{- toYaml .Values.securityContext.capabilities | nindent 14 }}
          # args, not command: the image's ENTRYPOINT (docker-entrypoint.sh) must stay in effect --
          # it runs `acde migrate` before exec'ing this. `command:` here would override the
          # entrypoint entirely and silently skip migrations on every pod start.
          args: ["acde", "serve", "--host", "0.0.0.0"]
          ports:
            - containerPort: {{ .Values.server.service.port }}
          env:
            {{- include "acde.commonEnv" . | nindent 12 }}
          # D-087: /health is unauthenticated and shallow, built exactly for this.
          readinessProbe:
            httpGet: {path: /health, port: {{ .Values.server.service.port }}}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: {{ .Values.server.service.port }}}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "acde.fullname" . }}-server
  labels:
    {{- include "acde.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "acde.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.server.service.port }}
      targetPort: {{ .Values.server.service.port }}
{{- if .Values.server.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "acde.fullname" . }}-server
  labels:
    {{- include "acde.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "acde.fullname" . }}-server
  minReplicas: {{ .Values.server.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.server.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.server.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}

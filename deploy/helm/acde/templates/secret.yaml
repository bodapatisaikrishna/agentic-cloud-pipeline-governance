{{- if not .Values.secrets.existingSecret }}
# Quick local/kind testing only. For real infrastructure, create this Secret yourself (kubectl
# create secret generic, or your secret manager's CSI driver / External Secrets Operator) and set
# secrets.existingSecret — inlining real credentials into a values.yaml a chart applies from is not
# an acceptable production pattern even though Kubernetes Secrets themselves aren't plaintext at
# rest by default.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "acde.fullname" . }}-secrets
  labels:
    {{- include "acde.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.secrets.apiKey | quote }}
  airflow-password: {{ .Values.secrets.airflowPassword | quote }}
  oai-api-key: {{ .Values.secrets.oaiApiKey | quote }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | quote }}
  gemini-api-key: {{ .Values.secrets.geminiApiKey | quote }}
  {{- if not .Values.postgres.existingSecret }}
  postgres-password: {{ required "set postgres.password (local/kind testing only) or postgres.existingSecret for real infrastructure" .Values.postgres.password | quote }}
  {{- end }}
{{- end }}

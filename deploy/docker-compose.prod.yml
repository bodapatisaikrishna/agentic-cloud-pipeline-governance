# Production deployment (v2, P4): ACDE server + OPA + Postgres only.
# The company's orchestrator (Airflow) is EXTERNAL — ACDE attaches to it via connectors, so no demo
# Airflow/Redpanda here. Bring your own managed Postgres in real deployments (point ACDE_DB_* at it)
# and terminate TLS at a reverse proxy in front of the acde-server. See docs/OPERATIONS.md.
services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-acde}
    volumes:
      - acde_pgdata:/var/lib/postgresql/data
      - ../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-acde}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opa:
    image: openpolicyagent/opa:0.68.0
    command: ["run", "--server", "--addr", "0.0.0.0:8181", "/policies"]
    volumes:
      - ../infra/opa/policies:/policies:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  acde-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    env_file:
      - path: ../.env.prod
        required: false   # create it from .env.prod.example before deploying
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OPA_URL: http://opa:8181
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_healthy}
    ports:
      - "127.0.0.1:8099:8099"   # bind localhost; put a TLS reverse proxy in front
    restart: unless-stopped
    healthcheck:
      # D-087's shallow /health, no auth needed; urllib avoids adding curl/wget to the slim image.
      test: ["CMD", "python", "-c",
             "import urllib.request as u; u.urlopen('http://localhost:8099/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # D-088: the actual governing process, not just the API in front of it -- previously the compose
  # file ran only acde-server, and an operator started the loop manually with `acde run` in the
  # foreground per docs/OPERATIONS.md. Now supervised like every other service here.
  acde-loop:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    command: ["acde", "run", "--env", "prod"]
    env_file:
      - path: ../.env.prod
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      OPA_URL: http://opa:8181
    depends_on:
      postgres: {condition: service_healthy}
      opa: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      # No HTTP port to curl -- acde loop-health reads the D-088 heartbeat directly from Postgres.
      test: ["CMD", "acde", "loop-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s   # the loop's first tick needs a moment after container start

volumes:
  acde_pgdata:
